<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <title>User</title>
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="card" style="width: 50%; top: 50px;"> <!-- margin-top: 5%;-->
            <h5 class="card-header text-center">Usuario</h5>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col mb-3">
                            <label for="name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="name">
                        </div>
                        <div class="col mb-3">
                          <label for="email" class="form-label">Email</label>
                          <input type="email" class="form-control" id="email">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col mb-3">
                            <label for="phone" class="form-label">Telefono</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                        <div class="col mb-3">
                            <label for="user_id" class="form-label">ID de Usuario</label>
                            <input type="number" class="form-control" id="user_id">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col mb-3">
                            <label for="user_id" class="form-label">ID de Usuario</label>
                            <input type="number" class="form-control" id="user_id">
                        </div>
                        <div class="col mb-3">
                            <label for="user_group_id" class="form-label">ID de Usuario</label>
                            <select class="form-select" id="user_group_id">
                                <option selected>Selecciona un grupo</option>
                                <option value="1">Grupo 1</option>
                                <option value="2">Grupo 2</option>
                                <option value="3">Grupo 3</option>
                            </select>    
                        </div>
                    </div>
                    <div class="row">
                        <div class="col mb-3">
                            <label for="disabled" class="form-label">Deshabilitado</label>
                            <select class="form-select" id="disabled">
                                <option selected>Selecciona una opcion</option>
                                <option value="true">Verdadero</option>
                                <option value="false">Falso</option>
                            </select>   
                        </div>
                        <div class="col mb-3">
                            <label for="start_datetime" class="form-label">Fecha de inicio</label>
                            <input type="date" class="form-control" id="start_datetime">
                        </div>
                    </div> 
                    <div class="row">
                        <div class="col mb-3">
                            <label for="expiry_datetime" class="form-label">Fecha de expiración</label>
                            <input type="date" class="form-control" id="expiry_datetime">
                        </div>
                    </div>
                    <div class="row">
                        <button type="submit" class="col-3 btn btn-success me-md-2">Crear</button>
                        <button type="button" class="col-3 btn btn-primary me-md-2">Modificar</button>
                        <button type="button" class="col-3 btn btn-danger">Eliminar</button>
                    </div>      
                </form>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <div class="mb-3">
                        <label for="id" class="form-label">Id a buscar</label>
                        <input type="number" class="form-control" id="id">
                    </div>
                    <button type="button" class="btn btn-secondary me-md-2">Buscar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="formUser.js"></script>
</body>
</html>
