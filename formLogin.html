<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Login</title>
</head>
<body>
    <div class="d-flex justify-content-center">
        <div class="card" style="width: 60%; top: 150px;">
            <h5 class="card-header text-center bg-dark text-light">Usuario</h5>
            <div class="card-body bg-dark text-light">
                <form>
                    <div class="col mb-3">
                        <label for="login_id" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="login_id">
                    </div>
                    <div class="col mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                    <div class="col mb-3 text-center">
                        <span id="span-login" class="text-danger font-italic"></span>
                    </div>
                    <button type="submit" onclick="login(); return false;" class="btn btn-primary">Iniciar Sesion</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="formLogin.js"></script>
</body>
</html>
